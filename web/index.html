<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Signals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Stock Signals</h1>
    <p>Runs <code>/predict</code> on the engine. No client-side scoring.</p>
    <div id="health">checking…</div>
  </header>

  <form id="predict-form">
    <label>
      Ticker
      <input id="ticker" value="AAPL" maxlength="12" required />
    </label>
    <label>
      Horizon days
      <input id="horizon" type="number" min="1" max="60" value="14" />
    </label>
    <button type="submit">Run algorithm</button>
  </form>

  <p id="status"></p>
  <pre id="result">Engine output will appear here as returned.</pre>
  <script src="/dashboard.js"></script>
</body>
</html>
