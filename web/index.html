<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Signals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Stock Signals</h1>
        <p class="lede">Runs the engine only. This page does not score.</p>
      </div>
      <div id="health" class="pills">checking…</div>
    </header>

    <section class="card">
      <h2>1 · Find names</h2>
      <form id="search-form" class="row">
        <label>
          Search US symbols
          <input id="query" placeholder="AAPL or apple" />
        </label>
        <div class="btn-row">
          <button type="submit">Search</button>
          <button type="button" id="scan-us" class="ghost">Scan US market</button>
        </div>
      </form>
      <div id="hits" class="hits"></div>
    </section>

    <section class="card">
      <h2>2 · Run algorithm</h2>
      <form id="predict-form" class="row">
        <label>
          Ticker
          <input id="ticker" value="AAPL" maxlength="12" required />
        </label>
        <label class="narrow">
          Horizon (days)
          <input id="horizon" type="number" min="1" max="60" value="14" />
        </label>
        <div class="btn-row">
          <button type="submit">Run algorithm</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>3 · Book</h2>
      <p class="hint">Resolve after horizonEndDate. Optimize only uses saved outcomes.</p>
      <div class="btn-row">
        <button type="button" id="resolve" class="ghost">Resolve due</button>
        <button type="button" id="optimize" class="ghost">Optimize weights</button>
      </div>
    </section>

    <p id="status" class="status"></p>
    <section class="card readout" id="readout-card" hidden>
      <h2>Estimate (from the engine)</h2>
      <div id="readout" class="metrics"></div>
    </section>
    <section class="card output">
      <h2>Engine response</h2>
      <pre id="result">Waiting for a request.</pre>
    </section>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
