<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Signals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Stock Signals</h1>
    <p>Engine loop only. This page does not score.</p>
    <div id="health">checking…</div>
  </header>

  <ol class="flow">
    <li>Find names (search or US scan)</li>
    <li>Run <code>/predict</code> on a ticker (full algorithm)</li>
    <li>After <code>horizonEndDate</code>, resolve outcomes</li>
    <li>When enough resolved rows exist, optimize weights</li>
  </ol>

  <form id="search-form">
    <label>
      Search US symbols
      <input id="query" placeholder="AAPL or apple" />
    </label>
    <button type="submit">Search</button>
    <button type="button" id="scan-us">Scan US market</button>
  </form>
  <div id="hits"></div>

  <form id="predict-form">
    <label>
      Ticker
      <input id="ticker" value="AAPL" maxlength="12" required />
    </label>
    <label>
      Horizon days
      <input id="horizon" type="number" min="1" max="60" value="14" />
    </label>
    <button type="submit">Run algorithm</button>
  </form>

  <div class="actions">
    <button type="button" id="resolve">Resolve due predictions</button>
    <button type="button" id="optimize">Optimize weights</button>
  </div>

  <p id="status"></p>
  <pre id="result">Engine output will appear here as returned.</pre>
  <script src="/dashboard.js"></script>
</body>
</html>
