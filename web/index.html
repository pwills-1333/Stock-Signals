<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Signals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Stock Signals</h1>
    <p>The page only calls the engine. It does not score on its own.</p>
    <div id="health">checking…</div>
  </header>

  <form id="search-form">
    <label>
      Search US symbols
      <input id="query" placeholder="AAPL or apple" />
    </label>
    <button type="submit">Search</button>
  </form>
  <div id="search-hits"></div>

  <form id="predict-form">
    <label>
      Ticker
      <input id="ticker" value="AAPL" maxlength="12" required />
    </label>
    <label>
      Horizon days
      <input id="horizon" type="number" min="1" max="60" value="14" />
    </label>
    <button type="submit">Run algorithm</button>
    <button type="button" id="scan-us">Scan US market</button>
  </form>

  <p id="status"></p>
  <pre id="result">Engine output will appear here as returned.</pre>
  <script src="/dashboard.js"></script>
</body>
</html>
