<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Signals</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Stock Signals</h1>
      <p class="sub">Hybrid prediction engine</p>
    </div>
    <div id="health" class="health">checking…</div>
  </header>

  <main>
    <section class="card">
      <h2>Predict</h2>
      <form id="predict-form">
        <label>
          Ticker
          <input id="ticker" name="ticker" value="AAPL" maxlength="12" required />
        </label>
        <label>
          Horizon (days)
          <input id="horizon" name="horizon" type="number" min="1" max="60" value="14" />
        </label>
        <button type="submit">Run prediction</button>
      </form>
      <p id="predict-status" class="status" hidden></p>
      <div id="predict-result"></div>
    </section>

    <section class="card">
      <h2>Screener</h2>
      <form id="screen-form">
        <label class="wide">
          Universe (comma-separated)
          <input id="universe" name="universe" value="AAPL, MSFT, NVDA, AMZN, TSLA, META, AMD, GOOGL" />
        </label>
        <label>
          Horizon
          <input id="screen-horizon" type="number" min="1" max="30" value="14" />
        </label>
        <button type="submit">Scan</button>
      </form>
      <p id="screen-status" class="status" hidden></p>
      <div id="screen-result"></div>
    </section>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
