<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Signals</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background: #0f1115;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: #1a1d23;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
    .hidden {
      display: none;
    }
    .positive {
      color: #4ade80;
    }
    .negative {
      color: #f87171;
    }
    .badge-buy {
      background: #4ade80;
      color: #000;
    }
    .badge-sell {
      background: #f87171;
      color: #000;
    }
    .badge-hold {
      background: #e5e7eb;
      color: #000;
    }
    .badge-avoid {
      background: #fbbf24;
      color: #000;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="text-2xl font-bold mb-4">Stock Signals</h1>

    <div class="card">
      <label class="block mb-2">Ticker Symbol</label>
      <input id="tickerInput" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="AAPL, TSLA, NVDA" />
      <button onclick="loadTicker()" class="mt-3 px-4 py-2 bg-blue-500 rounded text-white">
        Analyze
      </button>
      <div id="status" class="mt-2 text-sm text-gray-400">● Idle</div>
    </div>

    <div id="loading" class="mt-4 text-gray-400 hidden">Loading...</div>

    <div id="predictionCard" class="card hidden">
      <h2 id="tickerName" class="text-xl font-semibold mb-2"></h2>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <div>Current Price</div>
          <div id="currentPrice" class="text-lg font-semibold"></div>
        </div>
        <div>
          <div>Predicted Price</div>
          <div id="predictedPrice" class="text-lg font-semibold"></div>
        </div>
      </div>

      <div class="mt-4">
        <div>Expected Return</div>
        <div id="expectedReturn" class="text-lg font-semibold"></div>
      </div>

      <div class="mt-4">
        <div>Confidence</div>
        <div id="confidence"></div>
      </div>

      <div class="mt-4">
        <div>Trade Grade</div>
        <div id="tradeGrade"></div>
      </div>

      <div class="mt-4">
        <span id="signalBadge" class="px-3 py-1 rounded-full text-sm font-semibold"></span>
      </div>

      <hr class="my-4 border-gray-700" />

      <h3 class="font-semibold mb-2">Risk Levels</h3>
      <div>Stop Loss: <span id="stopLoss"></span></div>
      <div>Take Profit: <span id="takeProfit"></span></div>
      <div>Kelly %: <span id="kellyPct"></span></div>

      <hr class="my-4 border-gray-700" />

      <h3 class="font-semibold mb-2">Rationale</h3>
      <div id="rationale"></div>
    </div>

    <div id="mainContent" class="mt-10"></div>
  </div>

  <script>
    const API = "https://stock-signals-production.up.railway.app";

    async function loadTicker() {
      const ticker = document.getElementById("tickerInput").value.trim();
      if (!ticker) return;

      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("status").textContent = "● Loading";

      try {
        const res = await fetch(`${API}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticker, horizonDays: 14 })
        });

        const data = await res.json();
        renderPrediction(data);

        document.getElementById("status").textContent = "● Live";
      } catch (err) {
        document.getElementById("loading").textContent = "Error: " + err.message;
        document.getElementById("status").textContent = "Error";
      }
    }

    function renderPrediction(p) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("predictionCard").classList.remove("hidden");

      document.getElementById("tickerName").textContent = p.ticker;
      document.getElementById("currentPrice").textContent = "$" + p.entryPrice.toFixed(2);
      document.getElementById("predictedPrice").textContent = "$" + p.predictedPrice.toFixed(2);

      document.getElementById("expectedReturn").textContent =
        (p.expectedReturn >= 0 ? "+" : "") + (p.expectedReturn * 100).toFixed(1) + "%";
      document.getElementById("expectedReturn").className =
        "text-lg font-semibold " + (p.expectedReturn >= 0 ? "positive" : "negative");

      document.getElementById("confidence").textContent = Math.round(p.confidence * 100) + "%";
      document.getElementById("tradeGrade").textContent = p.tradeGrade.toFixed(2);

      const badge = document.getElementById("signalBadge");
      badge.textContent = p.signal.toUpperCase();
      badge.className =
        "px-3 py-1 rounded-full text-sm font-semibold " +
        (p.signal === "buy"
          ? "badge-buy"
          : p.signal === "sell"
          ? "badge-sell"
          : p.signal === "avoid"
          ? "badge-avoid"
          : "badge-hold");

      document.getElementById("stopLoss").textContent = "$" + p.stopLoss.toFixed(2);
      document.getElementById("takeProfit").textContent = "$" + p.takeProfit.toFixed(2);
      document.getElementById("kellyPct").textContent = (p.kellyPct * 100).toFixed(1) + "%";

      document.getElementById("rationale").textContent = p.rationale || "Analysis complete.";
    }
  </script>
</body>
</html>
